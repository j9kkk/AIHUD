<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI HUD · 渲染层调试开发环境</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    /* 调试脚手架专用样式 */
    .dev-toolbar {
      max-width: 900px;
      margin: 0 auto 24px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 0.5pt solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 11px;
    }
    .dev-toolbar-title {
      font-weight: 700;
      color: var(--cyan);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-right: 8px;
    }
    .dev-btn-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .dev-btn {
      padding: 4px 10px;
      border-radius: 6px;
      border: 0.5pt solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: var(--label);
      font-size: 11px;
      cursor: pointer;
      font-family: inherit;
      transition: background 120ms ease;
    }
    .dev-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }
    .dev-btn--active {
      background: rgba(10, 132, 255, 0.35);
      border-color: rgba(56, 189, 248, 0.6);
      color: #fff;
      font-weight: 600;
    }
    .dev-stage {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px 0 60px;
    }
    .dev-status {
      margin-left: auto;
      font-variant-numeric: tabular-nums;
      color: var(--label3);
    }
  </style>
</head>
<body>

  <!-- 调试控制工具条 -->
  <header class="dev-toolbar" role="toolbar" aria-label="开发调试工具栏">
    <span class="dev-toolbar-title">AI HUD Dev</span>
    
    <div class="dev-btn-group" role="group" aria-label="视图切换">
      <button class="dev-btn dev-btn--active" id="btn-view-panel" role="button" aria-label="切换到一级面板视图">L1 面板</button>
      <button class="dev-btn" id="btn-view-detail" role="button" aria-label="切换到二级详情视图">L2 详情</button>
      <button class="dev-btn" id="btn-view-settings" role="button" aria-label="切换到设置视图">偏好设置</button>
    </div>

    <div class="dev-btn-group" role="group" aria-label="动态与辅助功能">
      <button class="dev-btn" id="btn-toggle-motion" role="button" aria-label="切换 Reduce Motion 减弱动态效果">试跑 Reduce Motion</button>
    </div>

    <div class="dev-status" id="dev-status-indicator">
      <span>7 状态全覆盖 · 3 视觉形态</span>
    </div>
  </header>

  <!-- 渲染挂载目标 -->
  <main class="dev-stage">
    <div id="app"></div>
  </main>

  <!-- 浏览器原生 ESM 模块加载 -->
  <script type="module">
    import { renderHud } from './dist/main.js';
    import { mockHudViewModel, mockAccounts } from './dist/dev-mock.js';

    const appEl = document.getElementById('app');
    const hud = renderHud(appEl, mockHudViewModel);

    // 视图切换控制按钮
    const btnPanel = document.getElementById('btn-view-panel');
    const btnDetail = document.getElementById('btn-view-detail');
    const btnSettings = document.getElementById('btn-view-settings');
    const btnMotion = document.getElementById('btn-toggle-motion');

    function setActiveBtn(activeBtn) {
      [btnPanel, btnDetail, btnSettings].forEach(b => b.classList.remove('dev-btn--active'));
      activeBtn.classList.add('dev-btn--active');
    }

    btnPanel?.addEventListener('click', () => {
      hud.navigateTo('panel');
      setActiveBtn(btnPanel);
    });

    btnDetail?.addEventListener('click', () => {
      hud.navigateTo('detail', 'claude-main');
      setActiveBtn(btnDetail);
    });

    btnSettings?.addEventListener('click', () => {
      hud.navigateTo('settings');
      setActiveBtn(btnSettings);
    });

    btnMotion?.addEventListener('click', () => {
      const isReduced = document.body.classList.toggle('reduced');
      btnMotion.textContent = isReduced ? '恢复常规动效' : '试跑 Reduce Motion';
      btnMotion.classList.toggle('dev-btn--active', isReduced);
    });
  </script>
</body>
</html>
