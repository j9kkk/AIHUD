name: Swift

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14          # Xcode 15 / Swift 5.9，满足 .macOS(.v14)
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cd mvp
          swift build

      - name: Geometry regression
        run: |
          cd mvp
          AIHUD_DEMO=1 AIHUD_GEOM_TEST=8 .build/debug/AIHUD | tail -1
          AIHUD_DEMO=issue AIHUD_GEOM_TEST=8 .build/debug/AIHUD | tail -1

      - name: Bundle
        run: |
          cd mvp
          ./scripts/bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: AIHUD-app
          path: mvp/build/AIHUD.app
